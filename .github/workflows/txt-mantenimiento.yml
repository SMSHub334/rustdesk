# Build de la pantalla de mantenimiento (APK), proyecto en txt-mantenimiento/.
# Disparo manual: Actions -> "TXT Mantenimiento" -> Run workflow.
name: TXT Mantenimiento

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: txt-mantenimiento
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/debug/
          echo "=== APK contents ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TXT-Mantenimiento-apk
          path: txt-mantenimiento/app/build/outputs/apk/debug/app-debug.apk
